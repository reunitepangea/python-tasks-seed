name: Lint & Type Check

on: [pull_request, push]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        task:
        - 00.Demo
        - 01.InplaceSorting.s
        - 02.Base85

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv & Python
        uses: ./.github/actions/setup-python-env

      - name: mypy
        working-directory: ${{ matrix.task }}
        run: |
          . ../.venv/bin/activate
          mypy ./ --ignore-missing-imports

      - name: pylint
        working-directory: ${{ matrix.task }}
        run: |
          . ../.venv/bin/activate
          pylint ./ --fail-under=8.0

      - name: black
        working-directory: ${{ matrix.task }}
        run: |
          . ../.venv/bin/activate
          black --check ./ --diff

      - name: Upload linting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-${{ matrix.task }}
          path: ${{ matrix.task }}/**/lint-*.txt
